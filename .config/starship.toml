# One-line starship prompt, in the style of the "pure" preset.
#
#   ~/projects/dotfiles main* ❯                                      4s
#
# Left: folder, git branch, a * when the repo is dirty, then the prompt
# character. Right: how long the last command took (only when it was slow).
# Colours are the terminal's own ANSI colours. No Nerd Font icons needed.

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = "$directory$git_branch$git_state$git_status$character"
right_format = "$python$nodejs$rust$golang$cmd_duration"

[directory]
style = "blue"
truncation_length = 2
truncate_to_repo = true

[git_branch]
format = "[$branch]($style) "
style = "white"

[git_status]
format = "([(*$conflicted$untracked$modified$staged$renamed$deleted)](218)[$ahead_behind$stashed]($style) )"
style = "cyan"
# Zero-width spaces: invisible, but non-empty, so the single * above appears
# whenever any of these states is true. Don't replace them with "".
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "white"

[cmd_duration]
min_time = 2000
format = "[$duration]($style)"
style = "yellow"

# Tooling on the right: each only appears inside a project that uses it, and
# python also shows the active venv's name.
[python]
format = '[py $version( \($virtualenv\))]($style) '
style = "white"

[nodejs]
# Without this, a stray ~/node_modules makes node show up in the home folder.
detect_folders = []
format = "[node $version]($style) "
style = "white"

[rust]
format = "[rust $version]($style) "
style = "white"

[golang]
format = "[go $version]($style) "
style = "white"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"
