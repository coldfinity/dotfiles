# One-line starship prompt, in the style of the "pure" preset.
#
#   ~/projects/dotfiles main* ❯                                      4s
#
# Left: folder, git branch, a * when the repo is dirty, then the prompt
# character. Right: how long the last command took (only when it was slow).
# Colours are the terminal's own ANSI colours. No Nerd Font icons needed.

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = "$username$hostname$directory$git_branch$git_status$git_state$character"
right_format = "$status$python$nodejs$rust$golang$cmd_duration"

# user@host, shown always (not just over SSH). Styled to match the branch.
[username]
show_always = true
format = "[$user]($style)"
style_user = "white"
style_root = "red"
aliases = { "yudiwu" = "yslv" }

[hostname]
ssh_only = false
format = "[@$hostname]($style) [|](white) "
style = "white"
trim_at = "."
# Rename the machine in the prompt only (doesn't touch the real hostname).
aliases = { "Yudis-MacBook-Pro" = "maccas" }

[directory]
style = "blue"
truncation_length = 2
truncate_to_repo = true

[git_branch]
format = "[\\[$branch]($style)"
style = "white"

[git_status]
format = "[( *$conflicted$untracked$modified$renamed$deleted)](218)[( $staged)](green)[( $ahead_behind)( $stashed)]($style)[\\]](white) "
style = "cyan"
# Zero-width spaces: invisible, but non-empty, so the single * above appears
# whenever any of these states is true. Staged shows its own green +. Don't replace them with "".
conflicted = "​"
untracked = "​"
modified = "​"
staged = "+"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "white"

# Exit code of the last command, only when it failed.
[status]
disabled = false
format = "[✗ $status]($style) "
style = "red"

[cmd_duration]
min_time = 2000
format = "[$duration]($style)"
style = "yellow"

# Tooling on the right: each only appears inside a project that uses it, and
# python also shows the active venv's name.
[python]
format = '[py $version( \($virtualenv\))]($style) '
style = "white"

[nodejs]
# Without this, a stray ~/node_modules makes node show up in the home folder.
detect_folders = []
format = "[node $version]($style) "
style = "white"

[rust]
format = "[rust $version]($style) "
style = "white"

[golang]
format = "[go $version]($style) "
style = "white"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"
