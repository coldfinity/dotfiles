# Hyprland — Linux counterpart to aerospace/.config/aerospace/aerospace.toml
#
# Keybinds mirror the AeroSpace config so the muscle memory carries over:
# ALT is the mod, hjkl focus, ALT+SHIFT+hjkl move, ALT+SHIFT+; enters a
# "service" submap. Divergences from AeroSpace are called out inline.
#
# Docs: https://wiki.hypr.land/Configuring/

$mod = ALT
$term = wezterm
$menu = rofi -show drun
$files = nautilus

# ── monitors ────────────────────────────────────────────────────────
# Format: monitor = <output>, <resolution>@<hz>, <position>, <scale>
#
# Explicit modes matter: `preferred` uses the EDID-preferred mode, which on
# the M27Q X is only 60Hz. Check what a panel supports with:
#   hyprctl monitors all      (see the availableModes line)
monitor = DP-1, 2560x1440@240, 0x0, 1        # Gigabyte M27Q X
monitor = DP-3, 1920x1080@100, 2560x0, 1     # Dell P2425H

# Fallback for any other output (laptop panel, projector, …).
monitor = , preferred, auto, 1

# ── workspace → monitor assignment ──────────────────────────────────
# AeroSpace's workspace-to-monitor-force-assignment. Workspaces 1-5 live on
# the Gigabyte, 6-9 on the Dell; `default:true` picks what each monitor
# shows at startup. Pressing ALT+6 from the Gigabyte moves focus to the
# Dell rather than pulling workspace 6 across — that's the point of pinning.
workspace = 1, monitor:DP-1, default:true
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-1
workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-1

workspace = 6, monitor:DP-3, default:true
workspace = 7, monitor:DP-3
workspace = 8, monitor:DP-3
workspace = 9, monitor:DP-3

# ── input method (fcitx5) ───────────────────────────────────────────
# Chinese Pinyin via fcitx5, toggled with Super+Space. Replaces the
# GNOME ibus/libpinyin input source. Config lives in the fcitx5/ package.
#
# GTK_IM_MODULE is deliberately NOT set. GTK3.24+ and GTK4 speak the
# Wayland text-input-v3 protocol natively, and forcing the fcitx module
# on top of that is a known source of dead input in GTK4 apps (ghostty
# is GTK4). The Qt and X vars below are still needed because Qt has no
# equivalent auto-detection and XWayland clients have no text-input at
# all. If a GTK app ever refuses to accept Pinyin, uncommenting this is
# the first thing to try:
#   env = GTK_IM_MODULE,fcitx
# ── session environment ─────────────────────────────────────────────
# The session inherits a bare system PATH — no ~/.local/bin — so anything
# installed there is reachable from a shell (.zshrc adds it) but invisible
# to graphical launchers, which inherit the session instead. That is why a
# launcher entry with an unqualified Exec= finds /usr/bin/foo, not yours.
#
# ~/.tarball-installations/*/... entries are added explicitly rather than
# globbed: hyprland.conf has no glob expansion, and each tool puts its
# binary at a different depth.
env = PATH,$HOME/.local/bin:$HOME/.tarball-installations/wezterm/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games

env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = SDL_IM_MODULE,fcitx

# ── startup ─────────────────────────────────────────────────────────
# The bar. quickshell replaced waybar: the appearance was GTK3 CSS, which
# cannot draw anything that is not a styled box, so the hover drawers only
# existed because waybar shipped a `drawer` group type, tooltips were
# unstyleable GTK defaults, and the clock's calendar was fixed-width text
# in one of them. The quickshell config is QML — see quickshell/ in this
# repo, and shell.qml for the reasoning.
#
# `qs` finds ~/.config/quickshell/shell.qml on its own, which the stow
# package puts there; no -p needed.
exec-once = qs

# waybar is still installed and its config is still in waybar/ — swapping
# back is uncommenting this line and commenting the one above. Keep both
# until the quickshell bar has run for a while without surprises.
#
# Note they cannot both run: each reserves an exclusive zone at the top of
# the screen, so running both stacks two bars and steals 80px from every
# workspace.
# exec-once = waybar
# Wallpaper on the Gigabyte only; the Dell stays on misc:background_color.
#
# swaybg rather than hyprpaper: hyprpaper 0.8.3 on this box starts, claims
# the background layer, and draws nothing — `hyprctl layers` shows the
# background layer empty on both outputs and the verbose log freezes
# part-way through enumerating DP-3, never reaching the config parse (zero
# mentions of preload/wallpaper in the log). Not a config error; a minimal
# two-line config via -c behaves identically. Deps all resolve, so this
# isn't a broken package either — it's unfixed from our side.
exec-once = swaybg -o DP-1 -i /home/yudi-wu/.local/share/backgrounds/anime-girl-cat-raining-4k-4w.jpeg -m fill
# hypridle is deliberately NOT started. Every idle behaviour is manual:
# lock and sleep both live in the waybar power menu, and hyprlock can be
# run directly. hypridle.conf is kept as a reference with all listeners
# commented out — re-add this line to bring automatic idling back.
#
# Trade-off: general.before_sleep_cmd went with it, so a manual suspend
# no longer locks the session first. Lock before sleeping if that matters.
# exec-once = hypridle
exec-once = systemctl --user start hyprpolkitagent
# Notification daemon. Nothing implemented org.freedesktop.Notifications
# before this, so notify-send failed outright and every desktop
# notification was silently discarded. Config in the mako/ package.
exec-once = mako

# Clipboard history. Two watchers because cliphist stores text and
# images through separate wl-paste streams — one --watch cannot cover
# both. Recall with ALT+V (see the launchers section).
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# -d daemonises; fcitx5 must start after the env vars above are set,
# which exec-once guarantees.
exec-once = fcitx5 -d

# Lock immediately at session start, so the machine boots to the lock
# screen rather than straight to the desktop.
#
# This is not belt-and-braces over a display-manager prompt — there isn't
# one. GDM is configured for autologin on this box (`loginctl show-session`
# reports Service=gdm-autologin), so booting drops you onto a live desktop
# having authenticated nothing. This line is the only thing standing between
# a cold boot and an unlocked session.
#
# Last in the list on purpose. hyprlock's background is `path = screenshot`,
# which grabs whatever is on screen at the moment it starts — put it above
# swaybg and it captures the empty desktop before the wallpaper has painted,
# and you get a flat grey lock screen instead of the blurred wallpaper.
# Ordering only makes that likely, not certain: exec-once fires processes in
# order but does not wait for them to draw, so a slow first paint can still
# lose the race.
#
# If a PAM problem ever makes this unable to authenticate, it locks you out
# of the session at boot. Escape hatch: CTRL+ALT+F3 for a TTY, log in there
# and `pkill hyprlock`.
exec-once = hyprlock

# ── layer rules ─────────────────────────────────────────────────────
# Real frosted glass behind waybar. A layer surface is not a window, so the
# `decoration { blur }` block above does not reach it — layer surfaces have
# to be named explicitly. Without this, waybar's alpha just greys out
# whatever is behind it instead of blurring it.
#
# ignorealpha is the companion half: pixels below this opacity are left
# unblurred, so the fully transparent corners outside the bar's rounded
# edge don't get a visible rectangular halo of blur around them.
#
# Note the field is `ignore_alpha`. Most guides show `ignorezero` and the
# one-line `layerrule = blur, waybar` form; 0.53 moved layer rules to the
# same block syntax as windowrule and renamed the field, and both of the
# older spellings are silently rejected. `hyprctl configerrors` names the
# exact option it refused, which is the only practical way to find this.
layerrule {
    name = waybar-blur
    match:namespace = ^(waybar)$

    blur = true
    ignore_alpha = 0.2
}

# The quickshell bar, which sets this namespace itself via
# WlrLayershell.namespace in quickshell/.config/quickshell/Bar.qml. It needs
# its own rule rather than inheriting waybar's — the match is on the exact
# namespace string, so without this the frames render as flat dark boxes
# with no frost behind them, and their 0.30 fill (chosen to sit just above
# the ignore_alpha cutoff) has nothing to tint.
#
# Both rules coexist deliberately while the two bars are being compared.
layerrule {
    name = quickshell-blur
    match:namespace = ^(quickshell-bar)$

    blur = true
    ignore_alpha = 0.2
}

# Same treatment for mako, so notifications read as the same material as
# the bar rather than a flat opaque card floating over it.
layerrule {
    name = mako-blur
    match:namespace = ^(notifications)$

    blur = true
    ignore_alpha = 0.2
}

# And the launcher, so its panel is frosted rather than a flat sheet with
# the desktop legible through it.
layerrule {
    name = rofi-blur
    match:namespace = ^(rofi)$

    blur = true
    ignore_alpha = 0.2
}

# ── general ─────────────────────────────────────────────────────────
general {
    # AeroSpace gaps.inner = 10. Hyprland's gaps_in is a half-gap (applied
    # to both neighbours), so 5 here yields the same 10px between windows.
    gaps_in = 5
    # AeroSpace gaps.outer = 10 on all sides. The 40px top gap in the
    # AeroSpace config was to clear sketchybar; waybar reserves its own
    # exclusive zone, so no top override is needed here.
    gaps_out = 10

    border_size = 2
    layout = dwindle

    # Drag a window edge to resize it, no modifier needed. AeroSpace had no
    # equivalent (macOS windows resize from their own edges), so this is a
    # Linux addition rather than a port.
    #
    # border_size is only 2px, which is far too thin to grab reliably —
    # extend_border_grab_area widens the *hit area* to 15px without drawing
    # a thicker border. It has no effect unless resize_on_border is on.
    resize_on_border = true
    extend_border_grab_area = 15
    hover_icon_on_border = true
}

# dwindle is the closest analogue to AeroSpace's tiles layout, including
# the opposite-orientation-for-nested-containers normalization.
dwindle {
    pseudotile = true
    preserve_split = true

    # New windows always open to the right / below, never to the left.
    #
    # The default (0) picks the side from where the mouse happens to be
    # inside the focused window — left half opens left, right half opens
    # right. With follow_mouse = 0 the cursor just sits wherever you last
    # clicked, so the placement reads as random. 2 = always right/bottom;
    # 1 would be always left/top.
    force_split = 2
}

# ── look ────────────────────────────────────────────────────────────
# Blur so ghostty's `background-opacity = 0.8` / `background-blur-radius`
# actually render — on Wayland the compositor does the blurring.
decoration {
    rounding = 8

    blur {
        enabled = true
        size = 8
        passes = 3
    }
}

# ── animations ──────────────────────────────────────────────────────
# Everything instant, matching AeroSpace. `enabled = false` kills every
# node at once — no need to disable them individually.
#
# To bring motion back selectively, flip this to true and disable only
# what you don't want, remembering that In/Out children do NOT inherit a
# disabled parent (workspacesIn/Out, windowsIn/Out, … each need naming).
animations {
    enabled = false
}

# ── misc ────────────────────────────────────────────────────────────
# Kill Hyprland's built-in wallpaper. Without this the Dell (which swaybg
# deliberately skips) would show Hyprland's stock artwork rather than a
# plain backdrop. What's left is misc:background_color, #111111 by default.
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

input {
    kb_layout = us

    # Click-to-focus, like macOS. Hovering a window no longer focuses it;
    # use a click or ALT+hjkl. (1 = focus follows mouse, Hyprland's default.)
    follow_mouse = 0

    # Raw 1:1 mouse input — no pointer acceleration. `flat` means cursor
    # distance tracks physical distance regardless of how fast you move.
    # sensitivity 0 is unscaled; -1.0 … 1.0 adjusts without reintroducing accel.
    accel_profile = flat
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

# AeroSpace's on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
cursor {
    no_warps = false
}

# ── layout ──────────────────────────────────────────────────────────
# AeroSpace: alt-slash = 'layout tiles horizontal vertical'
bind = $mod, slash, togglesplit
# AeroSpace: alt-comma = 'layout accordion horizontal vertical'.
# Hyprland has no accordion; tabbed groups are the nearest equivalent.
bind = $mod, comma, togglegroup
bind = $mod, bracketleft,  changegroupactive, b
bind = $mod, bracketright, changegroupactive, f

# ── focus ───────────────────────────────────────────────────────────
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# ── move ────────────────────────────────────────────────────────────
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

# ── resize ──────────────────────────────────────────────────────────
# AeroSpace 'resize smart ±50' shrinks/grows along the container axis.
# Hyprland needs an explicit axis, so both are bound.
binde = $mod, minus, resizeactive, -50 0
binde = $mod, equal, resizeactive,  50 0
binde = $mod SHIFT, minus, resizeactive, 0 -50
binde = $mod SHIFT, equal, resizeactive, 0  50

# ── workspaces ──────────────────────────────────────────────────────
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

# `...silent` sends the window without following it, matching AeroSpace's
# move-node-to-workspace (which only follows with --focus-follows-window).
# Drop the `silent` suffix on a line if you want that one to follow.
bind = $mod SHIFT, 1, movetoworkspacesilent, 1
bind = $mod SHIFT, 2, movetoworkspacesilent, 2
bind = $mod SHIFT, 3, movetoworkspacesilent, 3
bind = $mod SHIFT, 4, movetoworkspacesilent, 4
bind = $mod SHIFT, 5, movetoworkspacesilent, 5
bind = $mod SHIFT, 6, movetoworkspacesilent, 6
bind = $mod SHIFT, 7, movetoworkspacesilent, 7
bind = $mod SHIFT, 8, movetoworkspacesilent, 8
bind = $mod SHIFT, 9, movetoworkspacesilent, 9

bind = $mod SHIFT, F, fullscreen

# AeroSpace: alt-tab = 'workspace-back-and-forth'
bind = $mod, Tab, workspace, previous
# AeroSpace: alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'
bind = $mod SHIFT, Tab, movecurrentworkspacetomonitor, +1

# ── launchers ───────────────────────────────────────────────────────
# No AeroSpace equivalent — on macOS these are Spotlight/Dock's job, but a
# bare Hyprland session has no other way to get a terminal open.
bind = $mod, Return, exec, $term
# ALT+Space — the launcher, in the spirit of Spotlight's Cmd+Space.
bind = $mod, Space, exec, $menu
# File manager. Note this sits one SHIFT away from ALT+SHIFT+E, which
# exits the session — see the warning on that bind below.
bind = $mod, E, exec, $files
# Clipboard history picker. `cliphist decode` is required on the way
# back out: the list shows a numeric id and a preview, not the payload.
bind = $mod, V, exec, cliphist list | rofi -dmenu -l 12 -p Clipboard -theme "$HOME/.config/rofi/dmenu.rasi" | cliphist decode | wl-copy
bind = $mod SHIFT, Q, killactive
# Quits the session. Behind a confirmation because it is one key away from
# ALT+E (file manager) and AeroSpace's equivalent did not exist — on macOS
# there is no "quit the window manager" shortcut to fat-finger. confirm.sh
# pre-selects Cancel, so Enter on reflex dismisses it.
bind = $mod SHIFT, E, exec, ~/.config/hypr/confirm.sh "Log out?" hyprctl dispatch exit
bind = $mod SHIFT, Space, togglefloating

# ── screenshots ─────────────────────────────────────────────────────
# ALT+SHIFT+S is the primary bind — this keyboard has no PrtSc key, and
# it echoes macOS's CMD+SHIFT+4. Add CTRL to grab everything instead of
# selecting. Both copy to the clipboard only; nothing is written to disk.
#
# Note the CTRL variant captures BOTH monitors stitched into one image
# (grim with no -o takes every output), not just the one you're on.
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = $mod CTRL SHIFT, S, exec, grim - | wl-copy

# Kept for keyboards that do have the key — harmless where it's absent.
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim - | wl-copy

# ── media keys ──────────────────────────────────────────────────────
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute   @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl s 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

# ── mouse ───────────────────────────────────────────────────────────
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ── service submap ──────────────────────────────────────────────────
# AeroSpace: alt-shift-semicolon = 'mode service'
bind = $mod SHIFT, semicolon, submap, service
submap = service

bind = , Escape, exec, hyprctl reload
bind = , Escape, submap, reset

# AeroSpace 'f' = layout floating tiling
bind = , F, togglefloating
bind = , F, submap, reset

# AeroSpace 'r' = flatten-workspace-tree. Hyprland has no flatten, but
# ungrouping + resetting split ratios is the practical equivalent.
bind = , R, togglegroup
bind = , R, submap, reset

# AeroSpace backspace = close-all-windows-but-current. Not a builtin;
# this walks the current workspace via hyprctl. Requires jq.
bind = , BackSpace, exec, hyprctl -j clients | jq -r --argjson ws "$(hyprctl -j activeworkspace | jq .id)" --arg cur "$(hyprctl -j activewindow | jq -r .address)" '.[] | select(.workspace.id == $ws and .address != $cur) | .address' | xargs -r -I{} hyprctl dispatch closewindow address:{}
bind = , BackSpace, submap, reset

# AeroSpace join-with <dir> — Hyprland's group equivalent is moveintogroup.
bind = $mod SHIFT, H, moveintogroup, l
bind = $mod SHIFT, J, moveintogroup, d
bind = $mod SHIFT, K, moveintogroup, u
bind = $mod SHIFT, L, moveintogroup, r
bind = $mod SHIFT, H, submap, reset
bind = $mod SHIFT, J, submap, reset
bind = $mod SHIFT, K, submap, reset
bind = $mod SHIFT, L, submap, reset

bindel = , down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , up,   exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = SHIFT, down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0
bind = SHIFT, down, submap, reset

submap = reset

# ── window rules ────────────────────────────────────────────────────
# The AeroSpace `[[on-window-detected]]` rule forcing ghostty to float is a
# workaround for macOS native tabs and is deliberately NOT ported — on
# Linux ghostty is a normal window and should tile.
# 0.53 uses block syntax for window rules; the old one-line
# `windowrule = rule, class:...` and `windowrulev2` forms are both gone.
windowrule {
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

# Tiling stays the default; ALT+SHIFT+SPACE floats an individual window
# when you want to drag it freely. `center = 1` only affects a window's
# initial placement if it opens floating — the `1` argument is what makes
# it respect the monitor's reserved area (the 40px waybar claims), where a
# bare `center = true` would centre against the raw monitor and can tuck a
# titlebar under the bar. Both parse, so the difference is silent.
windowrule {
    name = centre-floating-below-bar
    match:class = .*

    center = 1
}

windowrule {
    name = ghostty-opacity
    match:class = ^(com\.mitchellh\.ghostty)$

    opacity = 0.95 0.85
}
