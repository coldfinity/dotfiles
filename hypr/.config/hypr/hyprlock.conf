# hyprlock — lock screen.
#
# Themed to match waybar rather than hyprlock's stock sample, so the lock
# screen reads as part of the same desktop. Rosé Pine, the scheme wezterm
# runs (see the header of waybar/.config/waybar/style.css for the same
# table):
#
#   TEXT         #e0def4                primary labels
#   SUBTLE       #908caa                secondary text
#   MUTED        rgba(224,222,244,.5)   placeholder / hints
#   IRIS         #c4a7e7                accent — the scheme's purple
#   GLASS_BG     rgba(0,0,0,.25)        pill fill
#   GLASS_BORDER rgba(224,222,244,.2)   pill edge
#
# Like the waybar islands, the input field is deliberately square-edged
# (rounding = 0) — sketchybar's glass used corner_radius = 0.
#
# Text supports pango markup (<b>, <i>, <span>).
# Clear the password buffer with ESC, Ctrl+U or Ctrl+Backspace.
# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

$font      = JetBrainsMono Nerd Font
# The giant clock reads better in a hairline weight than in the SemiBold
# the bar uses. Both are real installed families (see `fc-list : family`).
$font_thin = JetBrainsMono NF ExtraLight

$white  = rgba(224, 222, 244, 1.0)
$grey   = rgba(144, 140, 170, 1.0)
$dim    = rgba(224, 222, 244, 0.5)
$accent = rgba(196, 167, 231, 1.0)
$glass  = rgba(0, 0, 0, 0.25)
$edge   = rgba(224, 222, 244, 0.2)

general {
    hide_cursor = true
}

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# ── background ──────────────────────────────────────────────────────
# `screenshot` grabs the desktop at lock time, so the blur is of whatever
# you were doing. brightness/vibrancy pull it well back — blur alone leaves
# bright windows washing out the white text on top.
background {
    monitor =
    path = screenshot

    blur_passes = 3
    blur_size = 8
    noise = 0.012
    contrast = 0.9
    brightness = 0.35
    vibrancy = 0.17
    vibrancy_darkness = 0.15
}

# ── clock ───────────────────────────────────────────────────────────
# Centred column: time, date, then the input field below the midline.
# Everything is anchored to the screen centre so it lands identically on
# the 2560x1440 Gigabyte and the 1920x1080 Dell.
label {
    monitor =
    text = $TIME
    color = $white
    font_size = 120
    font_family = $font_thin

    # A soft drop shadow keeps the text legible over a bright wallpaper
    # without needing to dim the background any further.
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)
    shadow_boost = 1.2

    # 120px above the date. The gap has to be measured from the glyph box,
    # not the number's ink — a 120px font leaves a lot of descender space
    # under the digits, so a nominal 90 read as almost touching.
    position = 0, 240
    halign = center
    valign = center
}

# ── date ────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = $grey
    font_size = 20
    font_family = $font

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.5)

    position = 0, 120
    halign = center
    valign = center
}

# ── who ─────────────────────────────────────────────────────────────
# $DESC is the full name from /etc/passwd, falling back to the username.
label {
    monitor =
    text = <span foreground="##c4a7e7"></span>  $DESC
    color = $white
    font_size = 15
    font_family = $font

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.5)

    position = 0, 45
    halign = center
    valign = center
}

# ── password ────────────────────────────────────────────────────────
input-field {
    monitor =
    # Fixed px rather than the sample's percentages — a % width gives two
    # differently-sized boxes across the two panels.
    size = 340, 50
    outline_thickness = 1
    rounding = 0

    inner_color = $glass
    outer_color = $edge
    # Accent while checking, and only the fail state uses a warm colour —
    # a wrong password should be the one thing that stands out.
    check_color = $accent
    fail_color = rgba(235, 111, 146, 1.0)
    capslock_color = rgba(246, 193, 119, 1.0)

    font_color = $white
    font_family = $font
    placeholder_text = <span foreground="##e0def480">Password</span>
    fail_text = <span foreground="##e0def4">$FAIL <b>($ATTEMPTS)</b></span>

    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = true
    fade_on_empty = false

    position = 0, -20
    halign = center
    valign = center
}

# ── status line ─────────────────────────────────────────────────────
# Bottom-left, in the same understated grey as the bar's secondary text.
# Uptime is the one thing that is genuinely useful to see while locked —
# it tells you at a glance whether the machine slept or rebooted.
label {
    monitor =
    text = cmd[update:60000] echo "󰅐  $(uptime -p | sed 's/^up //')"
    color = $dim
    font_size = 13
    font_family = $font

    position = 30, 25
    halign = left
    valign = bottom
}

# Bottom-right: the hint you actually need when the screen looks frozen.
label {
    monitor =
    text = <span foreground="##e0def480">Type to unlock  ·  ESC clears</span>
    font_size = 13
    font_family = $font

    position = -30, 25
    halign = right
    valign = bottom
}
