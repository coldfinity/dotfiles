# hypridle — idle timeouts for the Hyprland session.
#
# PARTIALLY IN USE. Locking and display blanking are on; suspend is not.
#
# Everything here was disabled for a real reason: these listeners fire on
# INPUT idle, not on system load, so a long compile or download with no
# keyboard activity looked identical to an unattended machine. The original
# set would blank the displays and then suspend mid-job.
#
# That objection only ever applied to suspend. Locking does not interrupt a
# running job, and blanking a display does not either — both are safe to
# fire during a long build, and both are things you want on a desktop that
# autologins. Suspend stays off, because it is the one that would actually
# kill the work.
#
# Divergences from the vendor sample in /usr/share/hypr/hypridle.conf:
#
#   - Both brightnessctl listeners are removed. This machine has no
#     `backlight` class device (the monitors are external DP panels), so
#     `brightnessctl set 10` would fall through to the first LED it finds
#     — the wifi LED — and dim that instead of the screen. Screen-off is
#     handled by dpms below.
#   - Timeouts are stretched. The sample locks at 5min, which suits a
#     laptop carried between rooms; this is a desktop that sits idle
#     while long jobs run.
#
# Timings are cumulative from the last input event, not from each other.

general {
    # `pidof` guard stops a second hyprlock spawning over the first.
    lock_cmd = pidof hyprlock || hyprlock
    # Lock before suspending, so waking never shows the pre-suspend screen.
    before_sleep_cmd = loginctl lock-session
    # Without this the first keypress after resume only wakes the display
    # and has to be pressed again to reach the password field.
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 10min — lock. ENABLED.
#
# This is the counterpart to `exec-once = hyprlock` in hyprland.conf. That
# covers a cold boot; this covers walking away. GDM autologins on this box,
# so without the pair of them the machine is never locked at all.
#
# loginctl rather than calling hyprlock directly: it goes through logind, so
# the session is properly marked locked and `before_sleep_cmd` and the lock
# state agree with each other.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 10.5min — displays off, just after the lock has drawn. ENABLED.
#
# Safe during a long job: turning the panels off does not touch what is
# running, and on two always-on desktop monitors it is worth real power.
# The 30s gap after the lock is so the lock screen is already drawn when
# the panels go dark — otherwise waking shows the desktop for a frame
# before hyprlock appears over it.
listener {
    timeout = 630
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 60min — suspend. DELIBERATELY STILL DISABLED.
#
# This is the one the original objection was actually about. Input idle is
# not the same as an idle machine, and suspending a desktop 60 minutes into
# a compile, a download or a long render is destructive in a way that
# locking and blanking are not. Suspend stays manual, in the bar's power
# menu, where a human decides the machine is done.
#
# listener {
#     timeout = 3600
#     on-timeout = systemctl suspend
# }
