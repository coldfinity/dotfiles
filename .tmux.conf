unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-s

set -g mouse on

set -g mode-keys vi

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

set -g renumber-windows on
set -g set-clipboard on

# True Colours
set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'

# Navigator to easily switch between panes between tmux and nvim
set -g @plugin 'christoomey/vim-tmux-navigator'

# Theme
set -g @plugin 'rose-pine/tmux'
set -g @rose_pine_variant 'main' # Options are 'main', 'moon' or 'dawn'

# Ressurect and Continuum
set -g @continuum-restore 'on'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Sessionizer
set -g @plugin 'ThePrimeagen/tmux-sessionizer'
bind-key f run-shell "tmux neww ~/.tmux/plugins/tmux-sessionizer/tmux-sessionizer"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
